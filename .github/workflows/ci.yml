name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
    branches: [develop, master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package (dev extras)
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Pytest
        run: uv run pytest -q

      - name: Import smoke
        run: uv run python -c "import neo_harness; print(neo_harness.__version__)"
